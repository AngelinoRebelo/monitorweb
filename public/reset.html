<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2f24" />
    <title>Redefinir senha · MonitorWeb</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,560;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <div class="bg" aria-hidden="true"></div>
    <main class="auth-shell">
      <section class="auth-card panel">
        <div class="brand auth-brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="brand-name">MonitorWeb</p>
            <p class="brand-sub">nova senha</p>
          </div>
        </div>
        <h1>Redefinir senha</h1>
        <p class="lead" id="reset-lead">Informe a nova senha para a conta.</p>
        <form id="reset-form">
          <label>
            Nova senha
            <input id="password" type="password" required minlength="8" autocomplete="new-password" />
          </label>
          <label>
            Confirmar senha
            <input id="password2" type="password" required minlength="8" autocomplete="new-password" />
          </label>
          <p id="reset-error" class="auth-error" hidden></p>
          <button type="submit" class="btn primary" id="reset-submit">Salvar senha</button>
        </form>
        <p class="hint"><a href="/login.html">Voltar ao login</a></p>
      </section>
    </main>
    <script src="/reset.js" type="module"></script>
  </body>
</html>
